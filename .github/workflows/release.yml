name: Release

on:
  push:
    tags:
      - "v*"

env:
  COLUMNS: 120

jobs:
  call_run_ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: call_run_ci
    runs-on: ubuntu-24.04
    permissions:
      # needed for creating the GitHub release
      contents: write
      # needed for PyPI trusted publishing
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/mapli
    steps:
      - name: "Grab code"
        uses: actions/checkout@v7
        with:
          sparse-checkout: 'CHANGELOG.md'
          sparse-checkout-cone-mode: 'false'
      - name: "Download artifacts"
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: ${{ needs.call_run_ci.outputs.artifact_pattern }}
          merge-multiple: true
          path: dist
      # The version comes from Cargo.toml, so make sure it was bumped to match the tag. Listing each
      # expected file also makes sure no platform's wheel is missing from the release.
      - name: "Check that the built version matches the tag and all platforms were built"
        run: |
          version="${GITHUB_REF_NAME#v}"
          ls dist/mapli-"$version".tar.gz \
              dist/mapli-"$version"-*-manylinux_2_34_x86_64.whl \
              dist/mapli-"$version"-*-manylinux_2_34_aarch64.whl
      # Publish to PyPI before creating the GitHub release: an upload to PyPI cannot be redone,
      # while the GitHub release can be edited or deleted, so a failed upload must stop the job
      - name: "Publish to PyPI"
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
      - name: "Create GitHub release"
        uses: softprops/action-gh-release@v3.0.3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body_path: CHANGELOG.md
          append_body: true
