name: Continuous Integration

on:
  push:
    branches:
      - main

  pull_request:

  # allows building and testing the wheel on a branch, from the Actions tab
  workflow_dispatch:

  workflow_call:
    outputs:
      artifact_pattern:
        description: "Pattern matching the names of the uploaded wheel artifacts (one per platform)"
        value: ${{ jobs.build_wheel.outputs.artifact_pattern }}

jobs:
  # clippy runs as a check build, which cargo keeps separate from the regular build, so it needs its
  # own maplibre-native compile. Running it in its own job lets both compiles happen in parallel.
  lint_rust:
    runs-on: ubuntu-24.04
    env:
      # Route maplibre-native's from-source CMake build through ccache so C++ objects are reused across runs
      MLN_CMAKE_CXX_LAUNCHER: "ccache"
      # The C++ build happens in target/debug/build/maplibre_native-<hash>/out, and the hash changes with
      # e.g. the Rust toolchain version. Hash paths relative to the home dir (which covers both the
      # workspace and the cargo registry) and leave the build dir out of the hash, so cached objects
      # still match after such a change.
      CCACHE_BASEDIR: "/home/runner"
      CCACHE_NOHASHDIR: "true"
    steps:
      - name: "install system dependencies"
        run: |
          # these are taken from maplibre-native-rs' justfile
          sudo apt-get update
          sudo apt-get install -y \
              libgl1-mesa-dev \
              libegl1-mesa-dev \
              libgl1-mesa-dri \
              build-essential \
              libcurl4-openssl-dev \
              libuv1-dev \
              libz-dev \
              libfontconfig-dev \
              glslang-dev \
              glslang-tools \
              libicu-dev \
              libpng-dev \
              libjpeg-turbo8-dev \
              libwebp-dev \
              ccache \
              cmake \
              pkg-config

      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Cache maplibre-native C++ objects"
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G

      - name: "Format Rust code"
        run: cargo fmt --check

      - name: "Lint Rust code"
        run: cargo clippy -- --deny warnings

  run_ci:
    runs-on: ubuntu-24.04
    env:
      # Route maplibre-native's from-source CMake build through ccache so C++ objects are reused across runs
      MLN_CMAKE_CXX_LAUNCHER: "ccache"
      # The C++ build happens in target/debug/build/maplibre_native-<hash>/out, and the hash changes with
      # e.g. the Rust toolchain version. Hash paths relative to the home dir (which covers both the
      # workspace and the cargo registry) and leave the build dir out of the hash, so cached objects
      # still match after such a change.
      CCACHE_BASEDIR: "/home/runner"
      CCACHE_NOHASHDIR: "true"
    steps:
      - name: "install system dependencies"
        run: |
          # these are taken from maplibre-native-rs' justfile
          sudo apt-get update
          sudo apt-get install -y \
              libgl1-mesa-dev \
              libegl1-mesa-dev \
              libgl1-mesa-dri \
              build-essential \
              libcurl4-openssl-dev \
              libuv1-dev \
              libz-dev \
              libfontconfig-dev \
              glslang-dev \
              glslang-tools \
              libicu-dev \
              libpng-dev \
              libjpeg-turbo8-dev \
              libwebp-dev \
              ccache \
              cmake \
              pkg-config \
              xvfb

      - uses: actions/checkout@v7

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Cache maplibre-native C++ objects"
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}
          max-size: 2G

      # Python must be set up before any cargo build: setup-python sets PKG_CONFIG_PATH, which
      # openssl-sys tracks. If `cargo test` and `uv sync` saw different values, maplibre-native (which
      # depends on openssl-sys) would be rebuilt by each of them, in every run.
      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: "Set up Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Some Rust tests render, so they need the same virtual display as the Python tests (see below)
      - name: "Run Rust tests"
        # generous, as this step also compiles maplibre-native when the caches miss
        timeout-minutes: 45
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" cargo test --verbose

      - name: "Install Python code with dev dependencies"
        run: uv sync --frozen --group dev

      - name: "Run ruff linter"
        run: uv run ruff check

      - name: "Run ruff formatter"
        run: uv run ruff format --check

      - name: "Run ty"
        run: uv run ty check

      # Runners have no GPU or display. MapLibre's EGL headless backend calls
      # eglGetDisplay(EGL_DEFAULT_DISPLAY), which needs a display to fall back to
      # Mesa's llvmpipe software renderer, so provide a virtual one. LIBGL_ALWAYS_SOFTWARE makes
      # Mesa use llvmpipe directly, in case the host exposes a GPU device (see test_wheel).
      - name: "Run Python tests"
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" uv run pytest

  # Builds the distributable manylinux wheels, one per architecture, each on a native runner. This
  # is a release-mode build (another full maplibre-native compile), so it is skipped on pull requests.
  build_wheel:
    if: ${{ github.event_name != 'pull_request' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            image: quay.io/pypa/manylinux_2_34_x86_64:2026.10.03-1@sha256:e4ca528d41ab66b3654110295d7a2c7bfa599ddbb6efb269ec21f7f73b88f1b6
            # the sdist is the same for every architecture, so only one leg builds it
            build_sdist: "1"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: quay.io/pypa/manylinux_2_34_aarch64:2026.10.03-1@sha256:59827f7c1914f4c0ba114cfa2d0f83104a6b17a8eafb9c2abd45f929db090107
            build_sdist: "0"
    runs-on: ${{ matrix.runner }}
    # The wheel is built inside the manylinux image, so it links against that image's old glibc and
    # runs on any distro with the same or a newer one. scripts/build-manylinux-wheel.sh has the details.
    container: ${{ matrix.image }}
    env:
      BUILD_SDIST: ${{ matrix.build_sdist }}
      MLN_CMAKE_CXX_LAUNCHER: "ccache"
      # Inside the container, the workspace is under /__w and $HOME is /github/home. Keep the cargo
      # and rustup homes under /__w too, so a single ccache base dir covers both the maplibre-native
      # sources (in the cargo registry) and its build dir (in target/).
      CARGO_HOME: "/__w/.cargo"
      RUSTUP_HOME: "/__w/.rustup"
      CCACHE_BASEDIR: "/__w"
      CCACHE_NOHASHDIR: "true"
    # Matrix job outputs are last-writer-wins, so expose a pattern that matches every leg's artifact
    outputs:
      artifact_pattern: "wheels-*"
    steps:
      - uses: actions/checkout@v7

      - name: "Install build dependencies"
        run: |
          scripts/build-manylinux-wheel.sh deps
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: "Cache Rust build artifacts"
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: "Cache maplibre-native C++ objects"
        uses: hendrikmuhs/ccache-action@f09c25b45002a07be2955cbe52e8cee55643f89d # v1.2.24
        with:
          key: ${{ github.job }}-${{ matrix.arch }}
          max-size: 2G

      - name: "Build manylinux wheel and sdist"
        run: scripts/build-manylinux-wheel.sh build

      - name: "Upload built wheel as artifact"
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "wheels-linux-${{ matrix.arch }}"
          path: dist/
          retention-days: 2

  # Installs each built wheel on a plain Ubuntu runner of the same architecture, with only the
  # runtime dependencies that the README asks users to install, and runs the test suite against it.
  test_wheel:
    needs: build_wheel
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: "Install runtime dependencies"
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libegl-mesa0 libgl1-mesa-dri libcurl4t64 xvfb

      - uses: actions/checkout@v7

      - name: "Download built wheel"
        uses: actions/download-artifact@v8.0.1
        with:
          name: "wheels-linux-${{ matrix.arch }}"
          path: dist

      - name: "Set up uv"
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      # Not `uv run`: that would build mapli from source instead of using the wheel. The tests import
      # the installed package, since src/ is not on the path.
      - name: "Install wheel into a fresh venv"
        run: |
          uv venv --python 3.14
          uv pip install dist/*.whl pytest

      # Some ARM runner hosts expose a GPU device, so Mesa tries DRI3, which Xvfb does not support,
      # and eglInitialize() fails instead of falling back. Force the llvmpipe software renderer.
      - name: "Run Python tests against the wheel"
        timeout-minutes: 10
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" .venv/bin/pytest
