[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "mapli._core"
python-packages = ["mapli"]
python-source = "src"
editable-profile = "dev"
features = ["pyo3/extension-module"]

[project]
name = "mapli"
# taken from the version in Cargo.toml
dynamic = ["version"]
description = "Render MapLibre styles to PNG images and XYZ tiles with MapLibre Native, in-process"
readme = "README.md"
authors = [
    { name = "Ricardo Garcia Silva", email = "ricardo.garcia.silva@geobeyond.it" }
]
requires-python = ">=3.11"
dependencies = []

[project.urls]
Documentation = "https://geobeyond.github.io/mapli/"
Repository = "https://github.com/geobeyond/mapli"

[dependency-groups]
dev = [
    "fastapi[standard]>=0.142.2",
    "obstore>=0.12.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.84",
]
docs = [
    "mkdocstrings-python>=2.0.10",
    # also in the dev group. mkdocstrings uses it to format the signatures in the API reference,
    # and the docs CI job only installs this group, so without it there the signatures would
    # render unformatted
    "ruff>=0.16.10",
    "zensical>=0.0.71",
]

[tool.pytest.ini_options]
# dump the traceback of every thread if a test runs for longer than this, to diagnose hangs
faulthandler_timeout = 60

[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.rs" },
    { file = "mapli-core/**/*.rs"},
    { file = "Cargo.toml" },
    { file = "Cargo.lock" }
]

[tool.ruff]
# these pages include the example scripts with `--8<--` lines, which ruff would reformat
extend-exclude = ["docs/examples/*.md"]
