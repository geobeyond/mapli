[project]
site_name = "mapli"
site_description = "Python bindings for rendering MapLibre styles to images with MapLibre Native"
site_url = "https://geobeyond.github.io/mapli/"
repo_url = "https://github.com/geobeyond/mapli"
repo_name = "geobeyond/mapli"
docs_dir = "docs"
site_dir = "site"
nav = [
  { "Home" = [
    "index.md",
    { "Comparison with other projects" = "comparison.md" },
  ] },
  { "User guide" = [
    { "System requirements" = "user-guide/system-requirements.md" },
    { "Rendering a style" = "user-guide/rendering-a-style.md" },
    { "Center and zoom, or bounds" = "user-guide/center-zoom-and-bounds.md" },
    { "Tiles" = "user-guide/tiles.md" },
    { "Async rendering" = "user-guide/async.md" },
    { "Custom URL schemes" = "user-guide/custom-url-schemes.md" },
  ] },
  { "API reference" = "reference/" },
  { "Examples" = [
    "examples/index.md",
    { "Concurrent thumbnails" = "examples/thumbnails.md" },
    { "FastAPI web API" = "examples/fastapi.md" },
    { "Private bucket with obstore" = "examples/private-bucket.md" },
  ] },
  { "Development" = [
    "development/index.md",
    { "Wheels and releases" = "development/releasing.md" },
  ] },
  { "Changelog" = "changelog.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
def_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.snippets.base_path = ["."]
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
pymdownx.tabbed.combine_header_slug = true

# the API reference is generated from the docstrings in src/mapli, see the "Documentation"
# section of docs/development/index.md
[project.plugins.api-autonav]
modules = ["src/mapli"]
api_root_uri = "reference"
nav_section_title = "API reference"
exclude_private = true

[project.plugins.api-autonav.module_options.".*"]
heading_level = 1
show_symbol_type_heading = true

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
# only read the .pyi stub of the compiled mapli._core module, so that the output does not depend
# on whether the extension has been built
allow_inspection = false
inherited_members = true
merge_init_into_class = true
members_order = "source"
separate_signature = true
show_signature_annotations = true
signature_crossrefs = true
show_root_heading = true
# hides "Bases: RenderPool", which would point to the private mapli._core.RenderPool
show_bases = false
show_source = false
